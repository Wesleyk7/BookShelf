<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Empréstimo | BookShelf</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- =========================
         MENU LATERAL
    ========================== -->

    <aside class="menu-lateral">

        <div class="logo">
            <h2>📚 BOOKSHELF</h2>
            <p>Biblioteca Inteligente</p>
        </div>

        <nav>

            <a href="../index.html">
                Início
            </a>

            <a href="livros.html">
                Livros
            </a>

            <a href="#">
                Pesquisa
            </a>

            <a
                href="emprestimos.html"
                class="ativo"
            >
                Empréstimos
            </a>

            <a href="#">
                Estantes
            </a>

            <a href="#">
                Relatórios
            </a>

        </nav>

    </aside>


    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->

    <main class="conteudo">

        <!-- CABEÇALHO -->

        <header class="topo">

            <div>

                <h1>
                    Novo Empréstimo
                </h1>

                <p>
                    Registre a retirada de um livro.
                </p>

            </div>


            <a
                href="emprestimos.html"
                class="botao-voltar"
            >
                ← Voltar
            </a>

        </header>


        <!-- =========================
             FORMULÁRIO
        ========================== -->

        <section class="formulario-card">

            <!-- LIVRO SELECIONADO -->

            <div class="livro-selecionado">

                <small>
                    Livro selecionado
                </small>

                <h2 id="nome-livro">
                    Carregando...
                </h2>

                <p id="autor-livro">
                </p>

                <span
                    id="codigo-livro"
                    class="codigo-livro"
                >
                </span>

            </div>


            <!-- FORMULÁRIO -->

            <form
                id="form-emprestimo"
                autocomplete="off"
            >

                <!-- RESPONSÁVEL -->

                <div class="campo-formulario">

                    <label for="responsavel">
                        Responsável
                    </label>

                    <input
                        type="text"
                        id="responsavel"
                        placeholder="Nome do responsável"
                        required
                    >

                </div>


                <!-- DATAS -->

                <div class="linha-formulario">

                    <div class="campo-formulario">

                        <label for="data-retirada">
                            Data da retirada
                        </label>

                        <input
                            type="date"
                            id="data-retirada"
                            required
                        >

                    </div>


                    <div class="campo-formulario">

                        <label for="data-prevista">
                            Previsão de devolução
                        </label>

                        <input
                            type="date"
                            id="data-prevista"
                            required
                        >

                    </div>

                </div>


                <!-- OBSERVAÇÕES -->

                <div class="campo-formulario">

                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea
                        id="observacoes"
                        rows="4"
                        placeholder="Ex.: livro com marcas na capa"
                    ></textarea>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="botao-principal"
                >
                    Confirmar empréstimo
                </button>

            </form>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="../js/novo-emprestimo.js"></script>

</body>

</html>
